"#77508f"/><text x="45" y="720" font-family="sans-serif" font-size="13" fill="#dce5f2">直交した2ロッドで単一ロッドの死点を回避。3軸は独立駆動ではない。</text><text x="45" y="742" font-family="sans-serif" font-size="13" fill="#dce5f2">予荷重0/1/3Nは未測定感度。4個の玉軸受を減らす代わりに6個の摺動関節と組立公差が増える。</text><text x="45" y="764" font-family="sans-serif" font-size="13" fill="#dce5f2">既存の各案グラフは5歯車バスのまま。別モデルの有利な値を混ぜない。</text></svg>
