<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="100%" height="100%" fill="#101722"/><text x="40" y="40" font-family="sans-serif" font-size="23" fill="#dce5f2">内輪接触を寸法で確認し、不適合スペーサーを除外</text><text x="40" y="74" font-family="sans-serif" font-size="15" fill="#f7c66f">v3-commercial-r3-01 / メーカー寸法の模式図。実部品断面CADではない。</text><circle cx="285" cy="310" r="208" fill="none" stroke="#7b8ea4" stroke-width="3" stroke-dasharray="none"/><text x="570" y="190" font-family="sans-serif" font-size="19" fill="#7b8ea4">外輪13mm</text><circle cx="285" cy="310" r="128" fill="none" stroke="#ff9977" stroke-width="3" stroke-dasharray="none"/><text x="570" y="234" font-family="sans-serif" font-size="19" fill="#ff9977">候補スペーサー外径8mm：不適合</text><circle cx="285" cy="310" r="118.4" fill="none" stroke="#6ad6a2" stroke-width="3" stroke-dasharray="5 4"/><text x="570" y="278" font-family="sans-serif" font-size="19" fill="#6ad6a2">686AZZ1 軸肩上限7.4mm</text><circle cx="285" cy="310" r="96" fill="none" stroke="#eaf0f7" stroke-width="3" stroke-dasharray="none"/><text x="570" y="322" font-family="sans-serif" font-size="19" fill="#eaf0f7">軸穴6mm</text><text x="570" y="405" font-family="sans-serif" font-size="18" fill="#ff9977">径の超過0.6mm、片側0.3mm。</text><text x="570" y="442" font-family="sans-serif" font-size="17" fill="#dce5f2">15mmカラー全面を直接当てる案も採らない。</text><text x="40" y="560" font-family="sans-serif" font-size="16" fill="#dce5f2">メーカー表: 686A開放 / 686AZZ1シールド。小売の『ISC 686ZZ』と同一とは未確認。</text><text x="40" y="599" font-family="sans-serif" font-size="16" fill="#dce5f2">別案: NSK 626ZZ + IWATA SC0607CB2（ボス9.2mm、適合欄626ZZ）。</text><text x="40" y="633" font-family="sans-serif" font-size="15" fill="#dce5f2">19mm外輪用の設計変更とNSK実当たり面の照合が未完。新しい組合せを計算へ黙って代入しない。</text><text x="40" y="708" font-family="sans-serif" font-size="14" fill="#dce5f2">32px/mmで外径を表示。隙間はメーカー軸肩寸法との照合であり、玉/溝/シールド形状の再現ではない。</text></svg>
