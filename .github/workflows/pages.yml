name: Showcase Pages

on:
  pull_request:
    paths:
      - site/**
      - .github/workflows/pages.yml
      - README*.md
      - docs/**
      - FreeCAD/**
      - STL/**
      - Blender/**
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
      - README*.md
      - docs/**
      - FreeCAD/**
      - STL/**
      - Blender/**
  workflow_dispatch:
    inputs:
      verify_live:
        description: Verify the published Pages site without deploying again
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install small site-only dependencies
        run: |
          python -m pip install --disable-pip-version-check -r site/requirements.txt
          npm ci --prefix site --ignore-scripts
          cd site
          npx playwright install --with-deps chromium
      - name: Build allowlisted static output
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python site/build.py --ref "$SOURCE_COMMIT"
      - name: Check content, asset budget, metadata and links
        run: npm --prefix site run test:static
      - name: Check real desktop and mobile browsers
        env:
          VERIFY_LIVE: ${{ inputs.verify_live }}
          SITE_URL: ${{ inputs.verify_live && 'https://ktanino10.github.io/TeoJansen_Rhinoceros/' || '' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if [ "$VERIFY_LIVE" = "true" ]; then
            python site/verify_live.py --expected-commit "$EXPECTED_COMMIT"
            npm --prefix site test -- --grep 'versions, source-bound|production journey|3D is opt-in|mobile touch|Matrix is complete|all three concrete guides|calculation|r7 public|r7 walking|localization'
          else
            npm --prefix site test
          fi
      - name: Save public-browser screenshots
        if: always() && inputs.verify_live
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-browser-evidence
          path: site/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Upload only the validated Pages bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.verify_live
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist/TeoJansen_Rhinoceros
          retention-days: 1

  deploy:
    name: Deploy verified showcase
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.verify_live
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
